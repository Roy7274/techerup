name: Build and Push Docker images to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（默认 latest）"
        required: false
        default: "latest"
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'Dockerfile'
      - 'docker-compose.yml'

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=latest; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image_front=${{ secrets.DOCKERHUB_USERNAME }}/teacherup-frontend:$TAG" >> $GITHUB_OUTPUT
          echo "image_back=${{ secrets.DOCKERHUB_USERNAME }}/teacherup-backend:$TAG" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.prep.outputs.image_front }}
          platforms: linux/amd64
          build-args: |
            HTTP_PROXY=
            HTTPS_PROXY=

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.prep.outputs.image_back }}
          platforms: linux/amd64
          build-args: |
            HTTP_PROXY=
            HTTPS_PROXY=


